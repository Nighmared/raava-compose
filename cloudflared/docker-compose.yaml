services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    deploy:
      mode: replicated
      endpoint_mode: vip
      replicas: 2
    logging:
      driver: "local"
      options:
        max-size: "10m"
    command:
      ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN}"]
    restart: always
